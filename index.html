<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111c"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><title>Ninth Tide — Legacy Alpha</title>
<style>
:root{color-scheme:dark;font-family:Georgia,serif;background:#07111c;color:#f2e9d9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#183b49 0,#091522 48%,#03070d 100%)}button{font:inherit;cursor:pointer;border:1px solid #bd9d62;color:#f6ead4;background:#142a36;border-radius:6px;padding:14px 18px;min-height:48px}button:hover,button:focus-visible{background:#294a54;outline:2px solid #d7bb7e;outline-offset:2px}.shell{max-width:1050px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,3vw,28px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #5e6270;padding-bottom:12px}header strong{letter-spacing:.15em;color:#e7c98b}.tools{display:flex;flex-wrap:wrap;gap:6px}.tools button{font-size:12px;padding:8px 12px;min-height:38px}.scene{position:relative;flex:1;min-height:350px;display:flex;align-items:flex-end;padding:20px 0 8px;isolation:isolate}.scene:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#367b87aa,transparent 60%);z-index:-1}.castle{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-size:clamp(110px,25vw,230px);filter:drop-shadow(0 10px 24px #0008);opacity:.62;user-select:none}.place{position:absolute;top:14px;left:6px;color:#d6b875;font:700 12px system-ui;letter-spacing:.2em}.portrait{font-size:clamp(85px,20vw,155px);margin:auto auto 5px;filter:drop-shadow(0 8px 12px #000a)}.panel{border:2px solid #bca16d;background:#0a1521ed;border-radius:10px;padding:18px;box-shadow:0 16px 40px #0009}.speaker{color:#e8c88e;font:700 13px system-ui;letter-spacing:.16em;text-transform:uppercase}.dialogue{font-size:clamp(18px,3.5vw,24px);line-height:1.5;min-height:90px;margin:12px 0 18px}.choices{display:grid;gap:10px}.choices button{text-align:left}.stats{font:12px system-ui;color:#b6d2d2;margin:12px 0;display:flex;gap:16px;flex-wrap:wrap}.foot{color:#a3adb5;font:12px system-ui;padding:12px 0}.hidden{display:none!important}.ending{color:#f4c875;font-size:clamp(28px,7vw,52px)}@media(min-width:800px){.shell{max-width:900px}.scene{min-height:420px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div style="padding:12px;background:#8d5425;color:white;font:15px system-ui;text-align:center">This is the legacy prototype. <a style="color:#fff2a4;font-weight:bold" href="./play.html">Play the new Prologue + Chapter 1 →</a></div><div class="shell"><header><strong>Ⅸ · NINTH TIDE</strong><div class="tools"><button id="save">Save</button><button id="load">Load</button><button id="restart">New story</button></div></header><main class="scene" id="theatre"><div class="place" id="place">THE SHORE</div><div class="castle" aria-hidden="true">♜</div><div class="portrait" id="portrait" aria-hidden="true">🌊</div></main><section class="panel" aria-live="polite"><div class="speaker" id="speaker">THE TIDE</div><p class="dialogue" id="dialogue"></p><div class="choices" id="choices"></div></section><div class="stats" id="stats"></div><footer class="foot">Playable narrative alpha · Choices affect relationships, currents, and fate · Local save slot</footer></div><script>
'use strict';
const KEY='ninth-tide-alpha-v1', characters={Mara:'🗡️',Elias:'📜',Vesper:'🎭',King:'👑',Tide:'🌊'};
const initial=()=>({node:'shore',lives:4,resolve:0,secrets:0,tide:0,bonds:{Mara:0,Elias:0,Vesper:0,King:0},visited:[],evidence:[],ending:null});
let state=initial();
const $=id=>document.getElementById(id);
const scenes={
shore:{place:'A SHORE WITHOUT WAVES',who:'Tide',line:'Every ninth tide, the drowned castle returns. You wake with four lives and no memory of the eight you lost.',choices:[['Follow the lantern into the harbour','harbour',{resolve:1}],['Search the wreckage for a name','wreck',{secrets:1}]]},
wreck:{place:'THE WRECK',who:'Tide',line:'Among the salt-bleached planks lies a silver key. Its teeth resemble the towers above the bay.',choices:[['Take the silver key','harbour',{evidence:'Silver key',secrets:1}],['Leave it to the sea','harbour',{tide:1}]]},
harbour:{place:'THE DROWNED HARBOUR',who:'Mara',line:'A swordswoman waits beside a boat with no reflection. “You promised you would remember me this time.”',choices:[['Trust Mara and board the boat','library',{bond:'Mara',resolve:1}],['Demand proof of her story','market',{secrets:1}],['Refuse her and follow the bells','theatre',{tide:1}]]},
market:{place:'THE MARKET OF NAMES',who:'Vesper',line:'The masked merchant offers to sell you the name you wore before the sea took it.',choices:[['Trade a memory for the name','theatre',{bond:'Vesper',secrets:1}],['Steal the ledger instead','library',{evidence:'Ledger of names',resolve:1}],['Walk away','library',{tide:1}]]},
theatre:{place:'THE THEATRE OF MASKS',who:'Vesper',line:'A stage is lit for an audience of empty chairs. Vesper whispers, “The ninth performance must end differently.”',choices:[['Accept Vesper’s mask','engine',{bond:'Vesper',tide:1}],['Unmask the actor','library',{secrets:1}],['Burn the script','engine',{resolve:1,lives:-1}]]},
library:{place:'THE LIBRARY BELOW',who:'Elias',line:'Elias shows you a book whose final chapter is written in your handwriting. “The King is not the first prisoner here.”',choices:[['Read the forbidden chapter','engine',{bond:'Elias',secrets:2}],['Ask Elias to join you','engine',{bond:'Elias',resolve:1}],['Tear out the last page','engine',{evidence:'Torn prophecy',tide:1}]]},
engine:{place:'THE HEART ENGINE',who:'Tide',line:'Beneath the castle, the tide is held inside a machine of bells and bone. A lever offers the power to stop its cycle.',choices:[['Break the engine','throne',{resolve:2,lives:-1}],['Learn who built it','throne',{secrets:2}],['Let the sea speak through you','throne',{tide:2}]]},
throne:{place:'THE THRONE OF SALT',who:'King',line:'The King rises. “You have arrived at the ninth tide. Decide who owns tomorrow.”',choices:[['Defy the King','judgment',{resolve:1}],['Expose the truth','judgment',{secrets:1}],['Embrace the tide','judgment',{tide:1}],['Offer the throne to an ally','judgment',{bond:'Mara'}]]},
judgment:{place:'THE FINAL TIDE',who:'Tide',line:'The castle shudders. Every oath, every secret, and every life you spent has brought you here.',choices:[['Let the ninth tide decide','finish',{}]]}
};
const endings=[
['The Crown of Salt','You inherit the throne and its terrible bargain.'],['The Shore Unbound','The sea recedes. For the first time, the castle remains empty.'],['Mara’s Oath','Mara takes your hand. The two of you leave the castle together.'],['Elias’s Testament','The truth survives in a book no tide can drown.'],['Vesper’s Masquerade','You vanish into the theatre, wearing a name that is finally yours.'],['The Drowned Sovereign','The tide chooses you as its eternal voice.'],['The Broken Ninth','The engine falls silent, but its last bell takes your final breath.'],['The Forgotten One','You walk away from the castle, leaving your name behind.'],['A Tenth Dawn','The cycle ends, and a dawn no prophecy foretold rises over the water.']
];
function endingIndex(){if(state.lives<=0)return 6;if(state.resolve>=4&&state.secrets>=3)return 8;if(state.bonds.Mara>=1&&state.resolve>=3)return 2;if(state.bonds.Elias>=1&&state.secrets>=4)return 3;if(state.bonds.Vesper>=1&&state.tide>=2)return 4;if(state.tide>=4)return 5;if(state.secrets>=4)return 1;if(state.resolve>=3)return 0;return 7;}
function apply(effect){if(effect.lives)state.lives=Math.max(0,state.lives+effect.lives);for(const k of ['resolve','secrets','tide'])if(effect[k])state[k]+=effect[k];if(effect.bond)state.bonds[effect.bond]++;if(effect.evidence&&!state.evidence.includes(effect.evidence))state.evidence.push(effect.evidence);}
function go(next,effect={}){apply(effect);if(next==='finish'||state.lives<=0){state.ending=endingIndex();state.node='ending';}else{state.node=next;state.visited.push(next);}render();}
function render(){const ending=state.node==='ending',scene=scenes[state.node];$('place').textContent=ending?'THE END':scene.place;$('speaker').textContent=ending?'ONE OF NINE FATES':scene.who;$('portrait').textContent=ending?'Ⅸ':characters[scene.who]||'🌊';$('dialogue').textContent=ending?endings[state.ending][0]+'. '+endings[state.ending][1]:scene.line;$('dialogue').classList.toggle('ending',ending);$('choices').replaceChildren();const options=ending?[['Begin another life',()=>{state=initial();render();}]]:scene.choices.map(([label,next,effect])=>[label,()=>go(next,effect)]);for(const [label,action]of options){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',action);$('choices').append(b);}$('stats').textContent='♥ Lives '+state.lives+' / 4   ·   Resolve '+state.resolve+'   ·   Secrets '+state.secrets+'   ·   Tide '+state.tide+'   ·   Evidence '+state.evidence.length;}
$('save').addEventListener('click',()=>{try{localStorage.setItem(KEY,JSON.stringify(state));alert('Story saved on this device.')}catch{alert('Saving is unavailable in this browser.')}});
$('load').addEventListener('click',()=>{try{const saved=JSON.parse(localStorage.getItem(KEY));if(!saved||typeof saved.node!=='string'||(saved.node!=='ending'&&!scenes[saved.node])||!saved.bonds)throw Error('Invalid save');state=saved;render();}catch{alert('No valid saved story found.')}});
$('restart').addEventListener('click',()=>{if(confirm('Start a new story? Unsaved progress will be lost.')){state=initial();render();}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
render();
</script></body></html>
